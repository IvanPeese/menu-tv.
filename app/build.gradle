plugins {
    id 'com.android.application'
}

android {
    namespace 'es.ivan.menutv'
    compileSdk 34

    defaultConfig {
        applicationId "es.ivan.menutv"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
