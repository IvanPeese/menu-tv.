<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Menú TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;background:#01030A;overflow:hidden;font-family:'Manrope',system-ui,'Segoe UI',Roboto,sans-serif}
#app{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform:translate(-50%,-50%);color:#F3F6FB}
.stage{position:absolute;inset:0;background:#01030A center/cover no-repeat}
#app[data-bg="0"] .stage{background-image:url(img/saturno.jpg)}
#app[data-bg="1"] .stage{background-image:url(img/anillos.jpg)}
#app[data-bg="2"] .stage{background-image:url(img/luna.jpg)}
#app[data-bg="3"] .stage{background-image:url(img/via.jpg)}
.scrim{position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(180deg,rgba(0,0,6,0),rgba(0,0,6,.72))}
.ui{position:absolute;inset:0}
.bar{position:absolute;left:72px;right:72px;top:28px;display:flex;gap:12px;align-items:center}
.pill{appearance:none;cursor:pointer;font-family:inherit;font-size:17px;font-weight:600;color:#E8EDF6;background:rgba(8,12,24,.55);padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
.pill.sel{background:#F3F6FB;color:#0A1020;border-color:#F3F6FB}
.pill.gap{margin-left:auto}
.big{text-shadow:0 2px 24px rgba(0,0,0,.6)}
#clock{font-weight:200;font-size:128px;letter-spacing:-4px;line-height:1}
#date{font-weight:600;font-size:28px;color:#DCE4F2}
.widgets{position:absolute;right:72px;top:96px;display:flex;gap:14px}
.wd{background:rgba(6,10,22,.62);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 18px;display:flex;align-items:center;gap:14px}
.wd svg,.wd .mars{flex:none}
.mars{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#E9906A 0,#C1502E 55%,#7A2A17 100%)}
.lab{font-size:12px;font-weight:800;letter-spacing:2px;color:rgba(243,246,251,.6);text-transform:uppercase}
.val{font-size:22px;font-weight:600;margin-top:2px;white-space:nowrap}
#factbox{position:absolute;left:72px;top:290px;width:330px;font-size:19px;line-height:1.45;color:#E4EBF7;text-shadow:0 2px 14px rgba(0,0,0,.85)}
#factbox .lab{display:block;margin-bottom:2px}
#label{position:absolute;left:72px;bottom:210px;font-size:30px;font-weight:800;text-shadow:0 2px 16px rgba(0,0,0,.8)}
.apps{position:absolute;left:66px;right:66px;bottom:62px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.tile{appearance:none;padding:0;border:0;cursor:pointer;width:140px;height:79px;border-radius:14px;overflow:hidden;background:#1b2433;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.55);position:relative;color:#fff;font-family:inherit;font-weight:800;font-size:16px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile img.ico{width:56px;height:56px;object-fit:contain}
.tile.sel{transform:scale(1.4);z-index:2}
.tile.all{background:rgba(8,12,24,.6);border:1px solid rgba(255,255,255,.25)}
.credit{position:absolute;right:28px;bottom:12px;font-size:11px;letter-spacing:.4px;color:#fff;opacity:.55}

/* ---------- Todas las apps ---------- */
#all{position:absolute;inset:0;z-index:5;background:#080e1c;display:none;padding:56px 72px;box-sizing:border-box}
#all.open{display:block}
#all h2{margin:0 0 24px;font-size:34px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:26px 22px;overflow:hidden;height:560px;align-content:start}
.g{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:16px;border:2px solid transparent;font-size:15px;font-weight:700;text-align:center;box-sizing:border-box;height:128px;overflow:hidden}
.g .box{width:140px;height:79px;border-radius:12px;background:#1b2433;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.g .box img{width:100%;height:100%;object-fit:cover}
.g .box img.ico{width:52px;height:52px;object-fit:contain}
.g.sel{border-color:#fff;background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div id="app" data-bg="0">
<div class="stage"></div>
<div class="scrim"></div>

<div class="ui">
<div class="bar" id="bar"></div>
<div style="position:absolute;left:72px;top:100px;display:flex;flex-direction:column;gap:4px">
<div class="big" id="clock">--:--</div>
<div class="big" id="date">&nbsp;</div>
</div>
<div class="widgets">
<div class="wd"><svg id="moonsvg" width="40" height="40" viewBox="0 0 40 40"></svg><div><div class="lab">Luna</div><div class="val" id="moontxt">--</div></div></div>
<div class="wd"><div class="mars"></div><div><div class="lab" id="marslab">Marte</div><div class="val" id="marstxt">--</div></div></div>
</div>
<div id="factbox"><span class="lab">✦ Dato del día</span><span id="fact"></span></div>
<div class="big" id="label"></div>
<div class="apps" id="apps"></div>
<div class="credit" id="credit"></div>
</div>

<div id="all"><h2>Todas las apps</h2><div class="grid" id="grid"></div></div>
</div>

<script>
(function () {
  /* ===================== CONFIGURACIÓN (edita aquí) ===================== */
  var CFG = {
    favs: [                                              // apps de la fila de abajo, en orden
      'com.netflix.ninja',
      'com.google.android.youtube.tv',
      'com.movistarplus.androidtv',
      'com.antena3.atresplayer.tv',
      'com.disney.disneyplus',
      'com.spotify.tv.android'
    ],
    browser: 'com.internet.tvbrowser',                   // app del botón "Navegador"
    inputsFallback: 'com.tcl.sourcemananger'             // si no se pueden listar las entradas
  };
  var FACTS = ["Un día en Venus dura más que un año venusiano.", "La luz del Sol tarda unos 8 minutos y 20 segundos en llegar a la Tierra.", "En el Sol cabrían más de un millón de Tierras.", "Saturno es menos denso que el agua.", "En Marte los atardeceres son de color azulado.", "La Vía Láctea tiene cientos de miles de millones de estrellas.", "Un año en Mercurio dura solo 88 días terrestres.", "La Luna se aleja de la Tierra unos 3,8 cm cada año.", "Neptuno completó su primera órbita desde su descubrimiento en 2011.", "Una cucharadita de estrella de neutrones pesaría miles de millones de toneladas.", "Olympus Mons, en Marte, es el volcán más alto del sistema solar.", "Los anillos de Saturno son sobre todo hielo de agua.", "La Voyager 1 es el objeto humano más lejano de la Tierra.", "En el espacio no se oye nada: no hay aire que transmita el sonido.", "La Estación Espacial Internacional da una vuelta a la Tierra cada 90 minutos.", "Titán, luna de Saturno, tiene lagos de metano líquido.", "Andrómeda, nuestra galaxia vecina, se acerca a la Vía Láctea.", "La Tierra viaja alrededor del Sol a unos 107.000 km/h.", "Plutón pasó a ser planeta enano en 2006.", "Algunas estrellas de neutrones giran cientos de veces por segundo.", "Ceres es el mayor objeto del cinturón de asteroides.", "Europa, luna de Júpiter, esconde un océano bajo su hielo.", "Parte de la luz de las estrellas que ves esta noche salió hace miles de años.", "El Sol concentra el 99,8 % de la masa del sistema solar.", "Un día en Júpiter dura menos de 10 horas.", "Encélado lanza chorros de vapor de agua desde su polo sur.", "M87* fue el primer agujero negro fotografiado, en 2019.", "Mercurio está más cerca del Sol, pero Venus es más caliente.", "La Gran Mancha Roja de Júpiter es una tormenta mayor que la Tierra.", "Cada segundo, el Sol convierte millones de toneladas de materia en energía.", "Si pudieras conducir hasta la Luna, tardarías unos 5 meses a 100 km/h."];
  var CREDITS = [
    'Saturno eclipsando al Sol · NASA/JPL-Caltech/SSI · Cassini',
    'Saturno y la Tierra, 2013 · NASA/JPL-Caltech/SSI · Cassini',
    'Valle de Taurus-Littrow · NASA · Apollo 17',
    'Vía Láctea sobre el VLT · ESO'
  ];
  /* ====================================================================== */

  var app = document.getElementById('app');

  /* ---- Fondo: cambia solo cada día; el botón "Fondo" lo cambia a mano ---- */
  var bgIdx = 0;
  function dayNum() { return Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000); }
  function setBg(i) {
    bgIdx = i; app.setAttribute('data-bg', String(i));
    document.getElementById('credit').textContent = CREDITS[i];
  }
  function pickBg() {
    var today = dayNum(), st = null;
    try { st = JSON.parse(localStorage.getItem('bg')); } catch (e) { }
    if (st && st.day === today) setBg(st.i % CREDITS.length);
    else setBg(today % CREDITS.length);
  }
  function nextBg() {
    var i = (bgIdx + 1) % CREDITS.length; setBg(i);
    try { localStorage.setItem('bg', JSON.stringify({ day: dayNum(), i: i })); } catch (e) { }
  }
  pickBg();

  /* ---- Puente: en la tele es el real; en un navegador del PC, uno de demostración ---- */
  var demoApps = [['com.netflix.ninja', 'Netflix', '#E50914'], ['com.google.android.youtube.tv', 'YouTube', '#C4302B'],
    ['com.movistarplus.androidtv', 'Movistar Plus+', '#019DF4'], ['com.antena3.atresplayer.tv', 'Atresplayer', '#0B1437'],
    ['com.disney.disneyplus', 'Disney+', '#113CCF'], ['com.spotify.tv.android', 'Spotify', '#1DB954'],
    ['com.internet.tvbrowser', 'Navegador', '#4A5568'], ['x.demo1', 'Fotos', '#805AD5'], ['x.demo2', 'Música', '#DD6B20'],
    ['x.demo3', 'Archivos', '#2B6CB0'], ['x.demo4', 'Juegos', '#38A169'], ['x.demo5', 'Ajustes', '#718096']];
  var demo = {
    getApps: function () { return JSON.stringify(demoApps.map(function (a) { return { pkg: a[0], label: a[1] }; })); },
    getIcon: function (p) {
      var a = demoApps.filter(function (x) { return x[0] === p; })[0]; if (!a) return '';
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180"><rect width="320" height="180" fill="' + a[2] + '"/><text x="160" y="105" font-size="40" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle">' + a[1] + '</text></svg>';
      return JSON.stringify({ u: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg), banner: true });
    },
    getInputs: function () { return JSON.stringify([{ id: 'h1', label: 'HDMI 1' }, { id: 'h2', label: 'HDMI 2' }, { id: 'av', label: 'AV' }]); },
    launch: function (p) { console.log('launch', p); return true; },
    launchInput: function (i) { console.log('input', i); return true; },
    openSettings: function () { console.log('settings'); }
  };
  var A = window.Android || demo;
  function J(s, d) { try { return JSON.parse(s); } catch (e) { return d; } }

  /* ---- Escala 1280x720 a la pantalla ---- */
  function fit() {
    var de = document.documentElement;
    var w = de.clientWidth || window.innerWidth || screen.width || 1280;
    var h = de.clientHeight || window.innerHeight || screen.height || 720;
    var s = Math.min(w / 1280, h / 720);
    if (!(s > 0)) s = 1;
    app.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit); addEventListener('load', fit); addEventListener('orientationchange', fit);
  fit(); setTimeout(fit, 300); setTimeout(fit, 1200); setTimeout(fit, 3500);

  /* ---- Reloj, Luna, Marte y dato del día (todo se calcula sin conexión) ---- */
  var elClock = document.getElementById('clock'), elDate = document.getElementById('date'), lastT = '', lastD = '';
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function moonSvg(f) {
    var r = 18, c = 20, ang = 2 * Math.PI * f, cos = Math.cos(ang), rx = Math.abs(cos * r).toFixed(2), d;
    if (f < 0.5) d = 'M' + c + ' ' + (c - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + c + ' ' + (c + r) + 'A' + rx + ' ' + r + ' 0 0 ' + (cos > 0 ? 0 : 1) + ' ' + c + ' ' + (c - r) + 'Z';
    else d = 'M' + c + ' ' + (c - r) + 'A' + r + ' ' + r + ' 0 0 0 ' + c + ' ' + (c + r) + 'A' + rx + ' ' + r + ' 0 0 ' + (cos > 0 ? 1 : 0) + ' ' + c + ' ' + (c - r) + 'Z';
    return '<circle cx="20" cy="20" r="18" fill="#222B3D"/><path d="' + d + '" fill="#EEF1F7"/>';
  }
  var lastSky = '';
  function sky(d) {
    var jd = d.getTime() / 86400000 + 2440587.5;
    var f = ((jd - 2451550.1) / 29.530588853) % 1; if (f < 0) f += 1;
    var pct = Math.round((1 - Math.cos(2 * Math.PI * f)) / 2 * 100);
    var name = (f < .03 || f > .97) ? 'Luna nueva' : f < .22 ? 'Creciente' : f < .28 ? 'Cuarto creciente' : f < .47 ? 'Gibosa creciente' : f < .53 ? 'Luna llena' : f < .72 ? 'Gibosa menguante' : f < .78 ? 'Cuarto menguante' : 'Menguante';
    var msd = (jd + 69.184 / 86400 - 2405522.0028779) / 1.0274912517, mf = msd - Math.floor(msd);
    var mh = Math.floor(mf * 24), mm = Math.floor((mf * 24 - mh) * 60);
    var key = pct + name + mh + ':' + mm + d.getDate();
    if (key === lastSky) return; lastSky = key;
    document.getElementById('moonsvg').innerHTML = moonSvg(f);
    document.getElementById('moontxt').textContent = name + ' · ' + pct + ' %';
    document.getElementById('marslab').textContent = 'Marte · Sol ' + Math.floor(msd);
    document.getElementById('marstxt').textContent = p2(mh) + ':' + p2(mm) + ' MTC';
    document.getElementById('fact').textContent = FACTS[(d.getDate() - 1) % FACTS.length];
  }
  function tick() {
    var d = new Date();
    var t = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    var raw = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    var dd = raw.charAt(0).toUpperCase() + raw.slice(1);
    if (t !== lastT) { elClock.textContent = t; lastT = t; sky(d); }
    if (dd !== lastD) { elDate.textContent = dd; lastD = dd; }
  }
  tick(); setInterval(tick, 1000);

  /* ---- Apps, iconos reales y entradas ---- */
  var installed = {}, labels = {}, iconQueue = [];
  var bar = document.getElementById('bar'), appsEl = document.getElementById('apps'), grid = document.getElementById('grid');
  var rows = [[], []], sel = { r: 1, c: 0 }, mode = 'main', gsel = 0, gridEls = [];

  function setIcon(img, box, pkg) {
    iconQueue.push(function () {
      var o = J(A.getIcon(pkg), null);
      if (o && o.u) {
        img.onload = function () { var c = dominant(img); if (c) { var t = img.closest ? img.closest('.tile') : null; if (t) { t.dataset.glow = c; if (t.classList.contains('sel')) glow(t); } } };
        img.src = o.u; if (!o.banner) img.className = 'ico';
      }
    });
  }
  function pump() {
    var f = iconQueue.shift();
    if (f) { try { f(); } catch (e) { } setTimeout(pump, 15); } else { pumping = false; }
  }
  var pumping = false;
  function startPump() { if (!pumping) { pumping = true; setTimeout(pump, 0); } }

  /* color dominante del icono (para el halo de la app enfocada) */
  function dominant(img) {
    try {
      var c = document.createElement('canvas'); c.width = c.height = 24;
      var x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
      var d = x.getImageData(0, 0, 24, 24).data, rs = 0, gs = 0, bs = 0, n = 0, ra = 0, ga = 0, ba = 0, na = 0;
      for (var i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 128) continue;
        var r = d[i], g = d[i + 1], b = d[i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        ra += r; ga += g; ba += b; na++;
        if (mx > 70 && (mx - mn) / mx > 0.35) { rs += r; gs += g; bs += b; n++; }
      }
      if (n > 8) return Math.round(rs / n) + ',' + Math.round(gs / n) + ',' + Math.round(bs / n);
      if (na) return Math.round(ra / na) + ',' + Math.round(ga / na) + ',' + Math.round(ba / na);
    } catch (e) { }
    return '';
  }
  function glow(t) {
    var c = t.dataset.glow || '255,255,255';
    t.style.boxShadow = '0 0 0 3px #fff,0 0 60px 16px rgba(' + c + ',.7),0 0 150px 46px rgba(' + c + ',.32)';
  }

  function pglow(t) {
    var c = t.dataset.glow || '255,255,255';
    t.style.boxShadow = '0 0 26px 7px rgba(' + c + ',.75),0 0 70px 20px rgba(' + c + ',.35)';
  }
  function pillColor(text, data) {
    if (data.input) { var t = String(text).toUpperCase(); return t.indexOf('AV') >= 0 ? '255,170,60' : '70,150,255'; }
    if (data.act === 'settings') return '190,200,220';
    if (data.act === 'bg') return '170,110,255';
    return '40,200,170';   // navegador
  }
  function pill(text, data) {
    var b = document.createElement('button'); b.className = 'pill'; b.textContent = text; b.dataset.glow = pillColor(text, data);
    for (var k in data) b.dataset[k] = data[k];
    b.onclick = function () { activate(b); };
    return b;
  }

  function build() {
    var list = J(A.getApps(), []);
    installed = {}; labels = {};
    list.forEach(function (a) { installed[a.pkg] = 1; labels[a.pkg] = a.label; });

    /* barra superior: entradas + navegador + ajustes */
    bar.innerHTML = '';
    var ins = J(A.getInputs(), []);
    if (!ins.length) bar.appendChild(pill('Entradas', { pkg: CFG.inputsFallback }));
    ins.forEach(function (i) { bar.appendChild(pill(i.label, { input: i.id })); });
    if (installed[CFG.browser]) bar.appendChild(pill('Navegador', { pkg: CFG.browser }));
    bar.appendChild(pill('⚙ Ajustes', { act: 'settings' }));
    var fb = pill('🖼 Fondo', { act: 'bg' }); fb.className += ' gap'; bar.appendChild(fb);

    /* fila de apps */
    appsEl.innerHTML = '';
    CFG.favs.forEach(function (p) {
      if (!installed[p]) return;
      var t = document.createElement('button'); t.className = 'tile'; t.dataset.pkg = p; t.dataset.label = labels[p] || '';
      var img = document.createElement('img'); img.alt = labels[p] || ''; t.appendChild(img); setIcon(img, t, p);
      t.onclick = function () { activate(t); };
      appsEl.appendChild(t);
    });
    var all = document.createElement('button'); all.className = 'tile all'; all.dataset.act = 'all'; all.dataset.label = 'Todas las apps';
    all.textContent = 'Todas'; all.onclick = function () { activate(all); };
    appsEl.appendChild(all);

    rows[0] = [].slice.call(bar.children); rows[1] = [].slice.call(appsEl.children);
    if (sel.c >= rows[sel.r].length) sel.c = Math.max(0, rows[sel.r].length - 1);

    /* cuadrícula de todas las apps */
    grid.innerHTML = ''; gridEls = [];
    list.sort(function (a, b) { return a.label.localeCompare(b.label, 'es'); }).forEach(function (a) {
      var g = document.createElement('div'); g.className = 'g'; g.dataset.pkg = a.pkg;
      var box = document.createElement('div'); box.className = 'box';
      var img = document.createElement('img'); box.appendChild(img); setIcon(img, box, a.pkg);
      var lb = document.createElement('div'); lb.textContent = a.label;
      g.appendChild(box); g.appendChild(lb);
      g.onclick = function () { A.launch(a.pkg); closeAll(); };
      grid.appendChild(g); gridEls.push(g);
    });
    startPump(); update();
  }

  function update() {
    [].forEach.call(document.querySelectorAll('.sel'), function (e) { e.classList.remove('sel'); });
    var label = document.getElementById('label');
    if (mode === 'main') {
      var el = rows[sel.r][sel.c];
      [].forEach.call(appsEl.children, function (t) { t.style.boxShadow = ''; });
      [].forEach.call(bar.children, function (t) { t.style.boxShadow = ''; });
      if (el) { el.classList.add('sel'); if (sel.r === 1) glow(el); else pglow(el); }
      label.textContent = (el && sel.r === 1) ? el.dataset.label : '';
    } else {
      label.textContent = '';
      var g = gridEls[gsel];
      if (g) { g.classList.add('sel'); g.scrollIntoView({ block: 'nearest' }); }
    }
  }

  function activate(el) {
    if (el.dataset.input) { if (!A.launchInput(el.dataset.input)) A.launch(CFG.inputsFallback); }
    else if (el.dataset.pkg) A.launch(el.dataset.pkg);
    else if (el.dataset.act === 'settings') A.openSettings();
    else if (el.dataset.act === 'bg') nextBg();
    else if (el.dataset.act === 'all') openAll();
  }
  function openAll() { mode = 'all'; gsel = 0; document.getElementById('all').classList.add('open'); grid.scrollTop = 0; update(); }
  function closeAll() { mode = 'main'; document.getElementById('all').classList.remove('open'); update(); }

  function move(dx, dy) {
    if (mode === 'all') {
      var n = gridEls.length, cols = 6, i = gsel;
      if (dx) i = Math.max(0, Math.min(n - 1, i + dx));
      if (dy) { var j = i + dy * cols; if (j >= 0 && j < n) i = j; }
      gsel = i; update(); return;
    }
    if (dy) {
      var r = Math.max(0, Math.min(1, sel.r + dy));
      if (r !== sel.r) { sel.r = r; sel.c = Math.min(sel.c, rows[r].length - 1); }
    }
    if (dx) sel.c = Math.max(0, Math.min(rows[sel.r].length - 1, sel.c + dx));
    update();
  }

  addEventListener('keydown', function (e) {
    var k = e.key, kc = e.keyCode, h = true;
    if (k === 'ArrowLeft' || kc === 21) move(-1, 0);
    else if (k === 'ArrowRight' || kc === 22) move(1, 0);
    else if (k === 'ArrowUp' || kc === 19) move(0, -1);
    else if (k === 'ArrowDown' || kc === 20) move(0, 1);
    else if (k === 'Enter' || kc === 13 || kc === 23) {
      if (mode === 'all') { var g = gridEls[gsel]; if (g) { A.launch(g.dataset.pkg); closeAll(); } }
      else { var el = rows[sel.r][sel.c]; if (el) activate(el); }
    }
    else if (k === 'Escape' || k === 'GoBack' || kc === 27) { if (mode === 'all') closeAll(); }
    else h = false;
    if (h) e.preventDefault();
  });

  window.onBack = function () { if (mode === 'all') closeAll(); };
  window.onHome = function () { closeAll(); sel = { r: 1, c: 0 }; update(); };
  window.refresh = function () { pickBg(); build(); };

  build();
})();
</script>
